<!doctype html>
<title>Golden Mouth — Payments Ledger</title>
<meta name="description" content="Payments dashboard for the Golden Mouth forest &amp; garden preserve, built from WhatsApp payment extraction.">
<style>
  :root {
    --bg: #F5F7F0;
    --surface: #FBFAF5;
    --surface-alt: #EFF2E8;
    --border: #DCE3D3;
    --ink: #1F2A22;
    --ink-muted: #5B6B5C;
    --ink-faint: #8A9A85;
    --forest: #3F8F5F;
    --forest-deep: #2B5E3F;
    --gold: #B8862B;
    --gold-soft: #E8D9B5;
    --gold-ink: #7A5A1D;
    --blue: #3E6FA6;
    --terracotta: #C2703A;
    --purple: #8B5FA8;
    --shadow: 0 1px 2px rgba(31,42,34,0.06), 0 4px 14px rgba(31,42,34,0.07);
    --radius-card: 12px;
    --radius-pill: 999px;
    --radius-bar: 4px;
    --font-display: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12180F;
      --surface: #1B2318;
      --surface-alt: #212B1C;
      --border: #2C3826;
      --ink: #EDEEE6;
      --ink-muted: #A8B39D;
      --ink-faint: #6B7A64;
      --forest: #6FA377;
      --forest-deep: #4C7A55;
      --gold: #D9AE55;
      --gold-soft: #3A2F17;
      --gold-ink: #E9CE93;
      --blue: #6FA0D6;
      --terracotta: #D68F5C;
      --purple: #B08FD1;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 4px 16px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12180F; --surface: #1B2318; --surface-alt: #212B1C; --border: #2C3826;
    --ink: #EDEEE6; --ink-muted: #A8B39D; --ink-faint: #6B7A64;
    --forest: #6FA377; --forest-deep: #4C7A55; --gold: #D9AE55; --gold-soft: #3A2F17; --gold-ink: #E9CE93;
    --blue: #6FA0D6; --terracotta: #D68F5C; --purple: #B08FD1;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 4px 16px rgba(0,0,0,0.4);
  }
  :root[data-theme="light"] {
    --bg: #F5F7F0; --surface: #FBFAF5; --surface-alt: #EFF2E8; --border: #DCE3D3;
    --ink: #1F2A22; --ink-muted: #5B6B5C; --ink-faint: #8A9A85;
    --forest: #3F8F5F; --forest-deep: #2B5E3F; --gold: #B8862B; --gold-soft: #E8D9B5; --gold-ink: #7A5A1D;
    --blue: #3E6FA6; --terracotta: #C2703A; --purple: #8B5FA8;
    --shadow: 0 1px 2px rgba(31,42,34,0.06), 0 4px 14px rgba(31,42,34,0.07);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 64px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* header */
  header.page-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .wordmark {
    font-family: var(--font-display);
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0;
  }
  .wordmark .golden { color: var(--gold); }
  .subtitle {
    margin: 4px 0 0;
    font-size: 0.78rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .period-badge {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    color: var(--ink-muted);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 6px 14px;
    white-space: nowrap;
  }

  /* section labels */
  .section-label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0 0 12px;
  }
  .chart-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .chart-head .section-label { margin: 0; }

  /* KPI row */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
  }
  .kpi-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    border-left: 3px solid var(--tile-color, var(--forest));
  }
  .kpi-tile .kpi-label {
    font-size: 0.72rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0 0 6px;
  }
  .kpi-tile .kpi-value {
    font-family: var(--font-display);
    font-variant-numeric: tabular-nums;
    font-size: 1.7rem;
    font-weight: 600;
    margin: 0;
  }
  .kpi-tile .kpi-sub {
    font-size: 0.76rem;
    color: var(--ink-faint);
    margin: 4px 0 0;
  }

  /* cards / panels */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 20px 22px;
    box-shadow: var(--shadow);
  }
  .two-col {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 14px;
    align-items: stretch;
  }
  @media (max-width: 820px) {
    .two-col { grid-template-columns: 1fr; }
  }

  /* legend */
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--ink-muted); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  /* chart */
  .chart-wrap { position: relative; }
  .chart-svg { width: 100%; height: auto; overflow: visible; }
  .bar-hover { cursor: pointer; }
  .gridline { stroke: var(--border); stroke-width: 1; }
  .axis-label { fill: var(--ink-faint); font-family: var(--font-mono); font-size: 10px; }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--ink);
    color: var(--bg);
    font-size: 0.76rem;
    padding: 8px 10px;
    border-radius: 8px;
    box-shadow: var(--shadow);
    transform: translate(-50%, -110%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.1s ease;
    z-index: 5;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip .t-amount { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* employee cards */
  .employee-cards { display: flex; flex-direction: column; gap: 10px; }
  .employee-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-alt);
  }
  .employee-id { display: flex; align-items: center; gap: 10px; }
  .employee-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .employee-name { font-weight: 600; margin: 0; }
  .employee-role { font-size: 0.76rem; color: var(--ink-muted); margin: 1px 0 0; }
  .employee-phone { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-faint); margin: 2px 0 0; }
  .employee-figures { text-align: right; }
  .employee-total { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size: 1.15rem; font-weight: 600; margin: 0; }
  .employee-count { font-size: 0.74rem; color: var(--ink-faint); margin: 2px 0 0; }

  /* donut */
  .donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .donut-center-value { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; }
  .donut-center-label { font-family: var(--font-body); font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase; fill: var(--ink-muted); }
  .donut-legend { display: flex; flex-direction: column; gap: 8px; }
  .donut-legend-row { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; }
  .donut-legend-amount { font-family: var(--font-mono); font-variant-numeric: tabular-nums; margin-left: auto; color: var(--ink-muted); }

  /* filters */
  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .filter-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit;
    font-size: 0.8rem;
    padding: 6px 13px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-muted);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--ink-faint); color: var(--ink); }
  .chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .chip.active { background: var(--forest-deep); border-color: var(--forest-deep); color: #fff; }
  .chip.active.gold-chip { background: var(--gold); border-color: var(--gold); color: #2a1f08; }

  /* table */
  .table-scroll { overflow-x: auto; }
  table.ledger { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  table.ledger thead th {
    text-align: left;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.ledger td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  table.ledger tbody tr:hover { background: var(--surface-alt); }
  table.ledger tbody tr:last-child td { border-bottom: none; }
  .cell-date { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-muted); white-space: nowrap; }
  .cell-employee { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .cell-amount { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .cat-pill {
    display: inline-block;
    font-size: 0.7rem;
    padding: 3px 9px;
    border-radius: var(--radius-pill);
    color: #fff;
    white-space: nowrap;
  }
  .cell-note { max-width: 260px; color: var(--ink); }
  .cell-source { max-width: 260px; color: var(--ink-faint); font-style: italic; font-size: 0.8rem; }
  .empty-state { text-align: center; padding: 30px; color: var(--ink-faint); font-size: 0.85rem; }

  footer.page-foot {
    text-align: center;
    font-size: 0.76rem;
    color: var(--ink-faint);
    padding-top: 8px;
  }
</style>

<main>
  <header class="page-head">
    <div>
      <h1 class="wordmark"><span class="golden">Golden</span> Mouth</h1>
      <p class="subtitle">Forest &amp; Garden Preserve · Payments Ledger</p>
    </div>
    <div class="period-badge" id="period-badge">—</div>
  </header>

  <section class="kpi-row" id="kpi-row" aria-label="Summary totals"></section>

  <section class="panel">
    <div class="chart-head">
      <p class="section-label" id="weekly-chart-title">Weekly Spend by Employee</p>
      <div class="filter-group" id="weekly-chart-toggle">
        <button class="chip active" data-mode="employee">By Employee</button>
        <button class="chip" data-mode="category">By Category</button>
      </div>
    </div>
    <div class="chart-wrap">
      <svg class="chart-svg" id="weekly-chart" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="tooltip" id="chart-tooltip"></div>
    </div>
    <div class="legend" id="weekly-legend"></div>
  </section>

  <section class="two-col">
    <div class="panel">
      <p class="section-label">By Employee</p>
      <div class="employee-cards" id="employee-cards"></div>
    </div>
    <div class="panel">
      <p class="section-label">By Category</p>
      <div class="donut-wrap">
        <svg width="150" height="150" viewBox="0 0 150 150" id="donut-svg"></svg>
        <div class="donut-legend" id="donut-legend"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <p class="section-label">Payment Ledger</p>
    <div class="filter-row">
      <div class="filter-group" id="employee-filters"></div>
      <div class="filter-group" id="category-filters"></div>
    </div>
    <div class="table-scroll">
      <table class="ledger">
        <thead>
          <tr>
            <th>Date</th>
            <th>Employee</th>
            <th>Category</th>
            <th style="text-align:right">Amount</th>
            <th>Note</th>
            <th>Source line</th>
          </tr>
        </thead>
        <tbody id="ledger-body"></tbody>
      </table>
      <div class="empty-state" id="empty-state" hidden>No payments match these filters.</div>
    </div>
  </section>

  <footer class="page-foot" id="footer-note">Generated from sample WhatsApp exports.</footer>
</main>

<script>
const CONTACTS = /*__CONTACTS_JSON__*/;
const PAYMENTS = /*__PAYMENTS_JSON__*/;

const EMPLOYEE_COLOR = { Ramesh: "var(--forest)", Suresh: "var(--blue)", Lakshmi: "var(--terracotta)" };
const CATEGORY_COLOR = { wage: "var(--forest)", bonus: "var(--gold)", reimbursement: "var(--blue)", advance: "var(--purple)" };
const CATEGORY_LABEL = { wage: "Wage", bonus: "Bonus", reimbursement: "Reimbursement", advance: "Advance" };

const employees = CONTACTS.filter(c => c.role === "employee");
const fmtINR = n => "₹" + Math.round(n).toLocaleString("en-IN");
const fmtDate = d => new Date(d + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
const fmtDateShort = d => new Date(d + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" });

// ---------- period badge ----------
(function renderPeriod() {
  const dates = PAYMENTS.map(p => p.date).sort();
  const el = document.getElementById("period-badge");
  el.textContent = dates.length ? `${fmtDateShort(dates[0])} – ${fmtDate(dates[dates.length - 1])}` : "No data";
})();

// ---------- KPIs ----------
const KPI_CATEGORY_SUB = {
  wage: "Base weekly labor",
  bonus: "Performance extras",
  reimbursement: "Materials & supplies",
  advance: "Paid ahead of an expense",
};

(function renderKPIs() {
  const total = PAYMENTS.reduce((s, p) => s + p.amount, 0);
  const byCat = {};
  PAYMENTS.forEach(p => { byCat[p.payment_category] = (byCat[p.payment_category] || 0) + p.amount; });

  const tiles = [
    { label: "Total Paid", value: fmtINR(total), sub: `${PAYMENTS.length} payments · ${employees.length} employees`, color: "var(--gold)" },
    ...Object.keys(CATEGORY_LABEL)
      .filter(c => byCat[c] > 0)
      .map(c => ({ label: CATEGORY_LABEL[c] + "s", value: fmtINR(byCat[c]), sub: KPI_CATEGORY_SUB[c], color: CATEGORY_COLOR[c] })),
  ];
  document.getElementById("kpi-row").innerHTML = tiles.map(t => `
    <div class="kpi-tile" style="--tile-color:${t.color}">
      <p class="kpi-label">${t.label}</p>
      <p class="kpi-value">${t.value}</p>
      <p class="kpi-sub">${t.sub}</p>
    </div>`).join("");
})();

// ---------- weekly grouped bar chart ----------
function isoWeekStart(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = (d.getDay() + 6) % 7; // Mon=0
  d.setDate(d.getDate() - day);
  return d.toISOString().slice(0, 10);
}

const WEEKLY_CHART_MODES = {
  employee: {
    title: "Weekly Spend by Employee",
    groupKey: p => p.name,
    seriesKeys: () => employees.map(e => e.name),
    color: key => EMPLOYEE_COLOR[key],
    label: key => key,
  },
  category: {
    title: "Weekly Spend by Category",
    groupKey: p => p.payment_category,
    seriesKeys: () => Object.keys(CATEGORY_LABEL).filter(c => PAYMENTS.some(p => p.payment_category === c)),
    color: key => CATEGORY_COLOR[key],
    label: key => CATEGORY_LABEL[key],
  },
};
let weeklyChartMode = "employee";

function renderWeeklyChart() {
  const mode = WEEKLY_CHART_MODES[weeklyChartMode];
  const weeks = {};
  PAYMENTS.forEach(p => {
    const wk = isoWeekStart(p.date);
    const key = mode.groupKey(p);
    weeks[wk] = weeks[wk] || {};
    weeks[wk][key] = (weeks[wk][key] || 0) + p.amount;
  });
  const weekKeys = Object.keys(weeks).sort();
  const seriesKeys = mode.seriesKeys();
  const max = Math.max(1, ...weekKeys.flatMap(w => seriesKeys.map(k => weeks[w][k] || 0)));

  const W = 1000, H = 300, padL = 46, padB = 34, padT = 12, padR = 8;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const groupW = plotW / weekKeys.length;
  const barGap = 2, barW = Math.max(4, (groupW - 14 - barGap * (seriesKeys.length - 1)) / seriesKeys.length);

  const niceMax = Math.ceil(max / 1000) * 1000;
  const gridSteps = 4;
  let svg = "";
  for (let i = 0; i <= gridSteps; i++) {
    const y = padT + plotH - (i / gridSteps) * plotH;
    const val = Math.round((i / gridSteps) * niceMax);
    svg += `<line class="gridline" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" />`;
    svg += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${val ? "₹" + (val/1000) + "k" : "0"}</text>`;
  }

  weekKeys.forEach((wk, wi) => {
    const gx = padL + wi * groupW + 7;
    svg += `<text class="axis-label" x="${gx + (groupW - 14) / 2}" y="${H - padB + 16}" text-anchor="middle">${fmtDateShort(wk)}</text>`;
    seriesKeys.forEach((key, ni) => {
      const val = weeks[wk][key] || 0;
      const bh = (val / niceMax) * plotH;
      const bx = gx + ni * (barW + barGap);
      const by = padT + plotH - bh;
      svg += `<rect class="bar-hover" x="${bx}" y="${by}" width="${barW}" height="${Math.max(bh,0)}" rx="4" ry="4" fill="${mode.color(key)}" data-week="${wk}" data-name="${mode.label(key)}" data-val="${val}"></rect>`;
    });
  });

  const svgEl = document.getElementById("weekly-chart");
  svgEl.innerHTML = svg;

  const tooltip = document.getElementById("chart-tooltip");
  svgEl.querySelectorAll("rect.bar-hover").forEach(rect => {
    rect.addEventListener("mouseenter", e => {
      const { week, name, val } = e.target.dataset;
      tooltip.innerHTML = `${name} · ${fmtDateShort(week)}<br><span class="t-amount">${fmtINR(val)}</span>`;
      tooltip.classList.add("visible");
    });
    rect.addEventListener("mousemove", e => {
      const wrap = svgEl.parentElement.getBoundingClientRect();
      tooltip.style.left = (e.clientX - wrap.left) + "px";
      tooltip.style.top = (e.clientY - wrap.top) + "px";
    });
    rect.addEventListener("mouseleave", () => tooltip.classList.remove("visible"));
  });

  document.getElementById("weekly-legend").innerHTML = seriesKeys.map(key => `
    <span class="legend-item"><span class="legend-dot" style="background:${mode.color(key)}"></span>${mode.label(key)}</span>
  `).join("");

  document.getElementById("weekly-chart-title").textContent = mode.title;
}

document.querySelectorAll("#weekly-chart-toggle .chip").forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.dataset.mode === weeklyChartMode) return;
    weeklyChartMode = btn.dataset.mode;
    document.querySelectorAll("#weekly-chart-toggle .chip").forEach(b => b.classList.toggle("active", b === btn));
    renderWeeklyChart();
  });
});

renderWeeklyChart();

// ---------- employee cards ----------
(function renderEmployeeCards() {
  const html = employees.map(emp => {
    const rows = PAYMENTS.filter(p => p.phone === emp.phone);
    const total = rows.reduce((s, p) => s + p.amount, 0);
    return `
      <div class="employee-card">
        <div class="employee-id">
          <span class="employee-dot" style="background:${EMPLOYEE_COLOR[emp.name]}"></span>
          <div>
            <p class="employee-name">${emp.name}</p>
            <p class="employee-role">${emp.category_label || ""}</p>
            <p class="employee-phone">${emp.phone}</p>
          </div>
        </div>
        <div class="employee-figures">
          <p class="employee-total">${fmtINR(total)}</p>
          <p class="employee-count">${rows.length} payments · avg ${fmtINR(rows.length ? total / rows.length : 0)}</p>
        </div>
      </div>`;
  }).join("");
  document.getElementById("employee-cards").innerHTML = html;
})();

// ---------- category donut ----------
(function renderDonut() {
  const totals = {};
  PAYMENTS.forEach(p => { totals[p.payment_category] = (totals[p.payment_category] || 0) + p.amount; });
  const cats = Object.keys(CATEGORY_LABEL).filter(c => totals[c] > 0);
  const grand = cats.reduce((s, c) => s + totals[c], 0);

  const r = 60, cx = 75, cy = 75, circumference = 2 * Math.PI * r;
  let offset = 0, svg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-alt)" stroke-width="18" />`;
  cats.forEach(c => {
    const frac = totals[c] / grand;
    // Every category with money gets at least a 5px visible mark, even if
    // its true proportional share is smaller than that (otherwise a tiny
    // category's slice gets clipped to a fraction of a pixel and vanishes).
    // At this donut's small on-screen size (150x150, no scaling), anything
    // much under this is indistinguishable from nothing after anti-aliasing.
    const len = Math.max(frac * circumference - 2, 5);
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${CATEGORY_COLOR[c]}" stroke-width="18"
      stroke-dasharray="${Math.max(len,0)} ${circumference}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" />`;
    offset += frac * circumference;
  });
  svg += `<text class="donut-center-value" x="${cx}" y="${cy - 3}" text-anchor="middle" fill="var(--ink)">${fmtINR(grand)}</text>`;
  svg += `<text class="donut-center-label" x="${cx}" y="${cy + 14}" text-anchor="middle">Total</text>`;
  document.getElementById("donut-svg").innerHTML = svg;

  document.getElementById("donut-legend").innerHTML = cats.map(c => `
    <div class="donut-legend-row">
      <span class="legend-dot" style="background:${CATEGORY_COLOR[c]}"></span>
      ${CATEGORY_LABEL[c]}
      <span class="donut-legend-amount">${fmtINR(totals[c])}</span>
    </div>`).join("");
})();

// ---------- ledger table + filters ----------
let activeEmployee = "all", activeCategory = "all";

function renderFilters() {
  const empHTML = ['<button class="chip active" data-emp="all">All employees</button>']
    .concat(employees.map(e => `<button class="chip" data-emp="${e.name}">${e.name}</button>`)).join("");
  document.getElementById("employee-filters").innerHTML = empHTML;

  const cats = Object.keys(CATEGORY_LABEL).filter(c => PAYMENTS.some(p => p.payment_category === c));
  const catHTML = ['<button class="chip active gold-chip" data-cat="all">All categories</button>']
    .concat(cats.map(c => `<button class="chip" data-cat="${c}">${CATEGORY_LABEL[c]}</button>`)).join("");
  document.getElementById("category-filters").innerHTML = catHTML;

  document.querySelectorAll("[data-emp]").forEach(btn => btn.addEventListener("click", () => {
    activeEmployee = btn.dataset.emp;
    document.querySelectorAll("[data-emp]").forEach(b => b.classList.toggle("active", b === btn));
    renderTable();
  }));
  document.querySelectorAll("[data-cat]").forEach(btn => btn.addEventListener("click", () => {
    activeCategory = btn.dataset.cat;
    document.querySelectorAll("[data-cat]").forEach(b => b.classList.toggle("active", b === btn));
    renderTable();
  }));
}

function renderTable() {
  const rows = PAYMENTS
    .filter(p => activeEmployee === "all" || p.name === activeEmployee)
    .filter(p => activeCategory === "all" || p.payment_category === activeCategory)
    .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

  document.getElementById("empty-state").hidden = rows.length > 0;

  document.getElementById("ledger-body").innerHTML = rows.map(p => `
    <tr>
      <td class="cell-date">${fmtDate(p.date)}</td>
      <td><span class="cell-employee"><span class="employee-dot" style="background:${EMPLOYEE_COLOR[p.name]}"></span>${p.name}</span></td>
      <td><span class="cat-pill" style="background:${CATEGORY_COLOR[p.payment_category]}">${CATEGORY_LABEL[p.payment_category]}</span></td>
      <td class="cell-amount">${fmtINR(p.amount)}</td>
      <td class="cell-note">${p.description}</td>
      <td class="cell-source" title="${p.source_excerpt.replace(/"/g, "&quot;")}">“${p.source_excerpt}”</td>
    </tr>`).join("");
}

renderFilters();
renderTable();

document.getElementById("footer-note").textContent =
  `Generated from ${new Set(PAYMENTS.map(p => p.chat_file)).size} sample WhatsApp exports · ${PAYMENTS.length} payment events logged.`;
</script>
