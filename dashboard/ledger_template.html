<!doctype html>
<title>SSA Ledger — Local Review</title>
<style>
  :root {
    --bg: #F5F7F0; --surface: #FBFAF5; --surface-alt: #EFF2E8; --border: #DCE3D3;
    --ink: #1F2A22; --ink-muted: #5B6B5C; --ink-faint: #8A9A85;
    --forest: #3F8F5F; --forest-deep: #2B5E3F; --gold: #B8862B;
    --blue: #3E6FA6; --terracotta: #C2703A; --purple: #8B5FA8; --red: #B0453F;
    --shadow: 0 1px 2px rgba(31,42,34,0.06), 0 4px 14px rgba(31,42,34,0.07);
    --radius: 10px;
    --font-display: ui-serif, Georgia, "Iowan Old Style", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12180F; --surface: #1B2318; --surface-alt: #212B1C; --border: #2C3826;
      --ink: #EDEEE6; --ink-muted: #A8B39D; --ink-faint: #6B7A64;
      --forest: #6FA377; --forest-deep: #4C7A55; --gold: #D9AE55;
      --blue: #6FA0D6; --terracotta: #D68F5C; --purple: #B08FD1; --red: #D97570;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 4px 16px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
  main { max-width: 1400px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-family: var(--font-display); font-size: 1.6rem; margin: 0; }
  .subtitle { color: var(--ink-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; margin: 4px 0 0; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .kpi-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow); }
  .kpi-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); margin: 0 0 4px; }
  .kpi-value { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; margin: 0; font-variant-numeric: tabular-nums; }

  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .filter-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 0.76rem; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-muted); cursor: pointer; }
  .chip:hover { border-color: var(--ink-faint); color: var(--ink); }
  .chip.active { background: var(--forest-deep); border-color: var(--forest-deep); color: #fff; }
  .search { font: inherit; font-size: 0.8rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); min-width: 200px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  thead th { position: sticky; top: 0; background: var(--surface-alt); text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
  thead th:hover { color: var(--ink); }
  thead th .arrow { opacity: 0.4; margin-left: 3px; }
  tbody td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:hover { background: var(--surface-alt); }
  tbody tr:last-child td { border-bottom: none; }
  .cell-date { font-family: var(--font-mono); color: var(--ink-muted); white-space: nowrap; }
  .cell-amount { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .cell-amount.credit { color: var(--forest); }
  .cell-amount.debit { color: var(--ink); }
  .pill { display: inline-block; font-size: 0.68rem; padding: 2px 8px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .status-pill { display: inline-block; font-size: 0.68rem; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--border); color: var(--ink-muted); }
  .status-pill.supported { border-color: var(--forest); color: var(--forest); }
  .narration { max-width: 260px; color: var(--ink-faint); font-size: 0.76rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: zoom-in; display: block; }
  .thumb-empty { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 0.7rem; border: 1px dashed var(--border); border-radius: 6px; }
  .empty-state { text-align: center; padding: 30px; color: var(--ink-faint); }

  /* lightbox */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; }
  .lightbox.visible { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
</style>

<main>
  <div>
    <h1>SSA Ledger — Local Review</h1>
    <p class="subtitle">Sri Swarnamukhi Ashrama · Jan–Mar 2026 · local-only, not for sharing</p>
  </div>

  <section class="kpi-row" id="kpi-row"></section>

  <div class="filter-row">
    <div class="filter-group" id="direction-filters"></div>
    <div class="filter-group" id="category-filters"></div>
    <input class="search" id="search" type="text" placeholder="Search counterparty or narration...">
  </div>

  <section class="panel">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th data-sort="txn_date">Date <span class="arrow"></span></th>
            <th data-sort="to_party">To</th>
            <th data-sort="from_party">From</th>
            <th data-sort="amount" style="text-align:right">Amount <span class="arrow"></span></th>
            <th data-sort="reporting_category">Category</th>
            <th>Sub-category</th>
            <th data-sort="status">Status</th>
            <th>Narration</th>
            <th>Proof</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div class="empty-state" id="empty-state" hidden>No transactions match these filters.</div>
    </div>
  </section>

  <div class="lightbox" id="lightbox"><img id="lightbox-img" src="" alt=""></div>
</main>

<script>
const TRANSACTIONS = /*__TRANSACTIONS_JSON__*/;

const CATEGORY_COLOR = {
  "2A - Phase-0 Pragya": "var(--forest)",
  "2B - Architecture": "var(--blue)",
  "2C - Operating/Admin": "var(--gold)",
  "Internal Transfer": "var(--ink-faint)",
  "Reversal": "var(--red)",
  "Income": "var(--purple)",
};

const fmtINR = n => "₹" + Math.round(n).toLocaleString("en-IN");
const fmtDate = d => new Date(d + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });

(function renderKPIs() {
  const debits = TRANSACTIONS.filter(t => t.direction === "debit" && t.expense_included);
  const credits = TRANSACTIONS.filter(t => t.direction === "credit" && t.reporting_category === "Income");
  const withEvidence = TRANSACTIONS.filter(t => t.thumbnail);
  const tiles = [
    { label: "Transactions", value: TRANSACTIONS.length },
    { label: "Expense Total", value: fmtINR(debits.reduce((s, t) => s + t.amount, 0)) },
    { label: "Income Total", value: fmtINR(credits.reduce((s, t) => s + t.amount, 0)) },
    { label: "With Matched Proof", value: `${withEvidence.length} / ${TRANSACTIONS.length}` },
  ];
  document.getElementById("kpi-row").innerHTML = tiles.map(t => `
    <div class="kpi-tile"><p class="kpi-label">${t.label}</p><p class="kpi-value">${t.value}</p></div>
  `).join("");
})();

let activeDirection = "all";
let activeCategory = "all";
let sortKey = "txn_date";
let sortDir = 1;

function renderFilters() {
  const dirHTML = ["all", "debit", "credit"].map(d => `
    <button class="chip ${d === activeDirection ? "active" : ""}" data-dir="${d}">${d === "all" ? "All" : d[0].toUpperCase() + d.slice(1)}</button>
  `).join("");
  document.getElementById("direction-filters").innerHTML = dirHTML;

  const cats = [...new Set(TRANSACTIONS.map(t => t.reporting_category))].filter(Boolean);
  const catHTML = ['<button class="chip active" data-cat="all">All categories</button>']
    .concat(cats.map(c => `<button class="chip" data-cat="${c}">${c}</button>`)).join("");
  document.getElementById("category-filters").innerHTML = catHTML;

  document.querySelectorAll("[data-dir]").forEach(btn => btn.addEventListener("click", () => {
    activeDirection = btn.dataset.dir;
    document.querySelectorAll("[data-dir]").forEach(b => b.classList.toggle("active", b === btn));
    renderTable();
  }));
  document.querySelectorAll("[data-cat]").forEach(btn => btn.addEventListener("click", () => {
    activeCategory = btn.dataset.cat;
    document.querySelectorAll("[data-cat]").forEach(b => b.classList.toggle("active", b === btn));
    renderTable();
  }));
  document.getElementById("search").addEventListener("input", renderTable);

  document.querySelectorAll("thead th[data-sort]").forEach(th => th.addEventListener("click", () => {
    const key = th.dataset.sort;
    sortDir = (sortKey === key) ? -sortDir : 1;
    sortKey = key;
    document.querySelectorAll("thead .arrow").forEach(a => a.textContent = "");
    th.querySelector(".arrow").textContent = sortDir === 1 ? "↑" : "↓";
    renderTable();
  }));
}

function renderTable() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  let rows = TRANSACTIONS
    .filter(t => activeDirection === "all" || t.direction === activeDirection)
    .filter(t => activeCategory === "all" || t.reporting_category === activeCategory)
    .filter(t => !q || [t.to_party, t.from_party, t.bank_narration, t.purpose].some(f => (f || "").toLowerCase().includes(q)));

  rows = rows.slice().sort((a, b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (av === bv) return 0;
    if (av === null || av === undefined) return 1;
    if (bv === null || bv === undefined) return -1;
    return (av > bv ? 1 : -1) * sortDir;
  });

  document.getElementById("empty-state").hidden = rows.length > 0;

  document.getElementById("table-body").innerHTML = rows.map(t => `
    <tr>
      <td class="cell-date">${fmtDate(t.txn_date)}</td>
      <td>${t.to_party || "—"}</td>
      <td>${t.from_party || "—"}</td>
      <td class="cell-amount ${t.direction}">${t.direction === "credit" ? "+" : "−"}${fmtINR(t.amount)}</td>
      <td>${t.reporting_category ? `<span class="pill" style="background:${CATEGORY_COLOR[t.reporting_category] || "var(--ink-faint)"}">${t.reporting_category}</span>` : "—"}</td>
      <td>${t.sub_category || "—"}</td>
      <td>${t.status ? `<span class="status-pill ${t.status === "Supported" ? "supported" : ""}">${t.status}</span>` : "—"}</td>
      <td class="narration" title="${(t.bank_narration || "").replace(/"/g, "&quot;")}">${t.purpose || t.bank_narration || ""}</td>
      <td>${t.thumbnail
        ? `<img class="thumb" src="${t.thumbnail}" data-full="${t.full_image || t.thumbnail}" alt="receipt">`
        : `<span class="thumb-empty">—</span>`}</td>
    </tr>`).join("");

  document.querySelectorAll(".thumb").forEach(img => img.addEventListener("click", () => {
    document.getElementById("lightbox-img").src = img.dataset.full;
    document.getElementById("lightbox").classList.add("visible");
  }));
}

document.getElementById("lightbox").addEventListener("click", () => {
  document.getElementById("lightbox").classList.remove("visible");
});

renderFilters();
renderTable();
</script>
