<!doctype html>
<title>Golden Face — Ledger</title>
<style>
  :root {
    --bg: #F5F7F0; --surface: #FBFAF5; --surface-alt: #EFF2E8; --border: #DCE3D3;
    --ink: #1F2A22; --ink-muted: #5B6B5C; --ink-faint: #8A9A85;
    --forest: #3F8F5F; --forest-deep: #2B5E3F; --gold: #B8862B;
    --blue: #3E6FA6; --terracotta: #C2703A; --purple: #8B5FA8; --red: #B0453F;
    --shadow: 0 1px 2px rgba(31,42,34,0.06), 0 4px 14px rgba(31,42,34,0.07);
    --shadow-hover: 0 2px 4px rgba(31,42,34,0.09), 0 8px 20px rgba(31,42,34,0.11);
    --radius: 10px;
    --font-display: ui-serif, Georgia, "Iowan Old Style", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12180F; --surface: #1B2318; --surface-alt: #212B1C; --border: #2C3826;
      --ink: #EDEEE6; --ink-muted: #A8B39D; --ink-faint: #6B7A64;
      --forest: #6FA377; --forest-deep: #4C7A55; --gold: #D9AE55;
      --blue: #6FA0D6; --terracotta: #D68F5C; --purple: #B08FD1; --red: #D97570;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 4px 16px rgba(0,0,0,0.4);
      --shadow-hover: 0 2px 4px rgba(0,0,0,0.42), 0 10px 24px rgba(0,0,0,0.48);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
  main { max-width: 1400px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .wordmark { font-family: var(--font-display); font-size: 1.8rem; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .wordmark .golden { color: var(--gold); }
  .subtitle { color: var(--ink-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; margin: 4px 0 0; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .kpi-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow); transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .kpi-tile:hover { transform: translateY(-2px) scale(1.02); box-shadow: var(--shadow-hover); }
  .kpi-label { display: inline-block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); margin: 0 0 6px; padding-bottom: 3px; border-bottom: 2px solid var(--gold); }
  .kpi-value { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; margin: 0; font-variant-numeric: tabular-nums; }

  .filter-row { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
  .filter-block { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-right: 18px; border-right: 1px solid var(--border); }
  .filter-block:last-of-type { border-right: none; padding-right: 0; }
  .filter-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); white-space: nowrap; }
  .filter-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 0.76rem; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-muted); cursor: pointer; }
  .chip:hover { border-color: var(--ink-faint); color: var(--ink); }
  .chip.active { background: var(--forest-deep); border-color: var(--forest-deep); color: #fff; }
  .search { font: inherit; font-size: 0.8rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); min-width: 200px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  thead th { position: sticky; top: 0; background: var(--surface-alt); text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
  thead th:hover { color: var(--ink); }
  thead th .arrow { opacity: 0.4; margin-left: 3px; }
  tbody td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:hover { background: var(--surface-alt); }
  tbody tr:last-child td { border-bottom: none; }
  .cell-date { font-family: var(--font-mono); color: var(--ink-muted); white-space: nowrap; }
  .cell-amount { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .cell-amount.credit { color: var(--forest); }
  .cell-amount.debit { color: var(--ink); }
  .pill { display: inline-block; font-size: 0.68rem; padding: 2px 8px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .status-pill { display: inline-block; font-size: 0.68rem; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--border); color: var(--ink-muted); }
  .status-pill.supported { border-color: var(--forest); color: var(--forest); }
  .narration { max-width: 260px; color: var(--ink-faint); font-size: 0.76rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .narration:hover { text-decoration: underline dotted var(--ink-faint); }
  .narration-box { background: var(--surface); color: var(--ink); border-radius: 10px; padding: 20px 24px; max-width: 560px; max-height: 80vh; overflow-y: auto; font-size: 0.85rem; line-height: 1.6; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  .narration-box .narration-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); margin: 0 0 8px; }
  .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: zoom-in; display: block; }
  .thumb-empty { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 0.7rem; border: 1px dashed var(--border); border-radius: 6px; }
  .empty-state { text-align: center; padding: 30px; color: var(--ink-faint); }

  /* admin editing */
  .editable { cursor: pointer; }
  .editable:hover { outline: 1px dashed var(--ink-faint); outline-offset: -2px; }
  .admin-edit-input { font: inherit; font-size: 0.8rem; padding: 3px 6px; border: 1px solid var(--forest); border-radius: 4px; width: 100%; box-sizing: border-box; background: var(--surface); color: var(--ink); }
  .proof-wrap { position: relative; display: inline-block; }
  .proof-replace { position: absolute; bottom: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--ink-muted); cursor: pointer; font-size: 0.7rem; line-height: 1; padding: 0; }
  .thumb-upload { width: 44px; height: 44px; border: 1px dashed var(--forest); border-radius: 6px; background: var(--surface); color: var(--forest); font-size: 0.62rem; cursor: pointer; }
  .btn-solid { background: var(--forest-deep); border-color: var(--forest-deep); color: #fff; }
  .btn-solid:hover { border-color: var(--forest-deep); color: #fff; opacity: 0.9; }
  .edit-link { margin-top: 12px; }
  .admin-form { display: flex; flex-direction: column; gap: 10px; }
  .admin-form label { display: flex; flex-direction: column; gap: 4px; font-size: 0.78rem; color: var(--ink-muted); }
  .admin-form input, .admin-form select, .admin-form textarea { font: inherit; font-size: 0.85rem; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--ink); }
  .admin-form textarea { min-height: 60px; resize: vertical; }
  .modal-actions { display: flex; gap: 8px; margin-top: 6px; }
  .form-error { color: var(--red); font-size: 0.8rem; margin: 6px 0 0; }

  /* lightbox */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; }
  .lightbox.visible { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
</style>

<main>
  <div>
    <h1 class="wordmark"><span class="golden">Golden</span> Face</h1>
    <p class="subtitle">Sri Swarnamukhi Ashrama · Jan–Mar 2026 Ledger</p>
  </div>

  <section class="kpi-row" id="kpi-row"></section>

  <div class="filter-row">
    <div class="filter-block">
      <span class="filter-label">Direction</span>
      <div class="filter-group" id="direction-filters"></div>
    </div>
    <div class="filter-block">
      <span class="filter-label">Category</span>
      <div class="filter-group" id="category-filters"></div>
    </div>
    <div class="filter-block">
      <span class="filter-label">Date Range</span>
      <input class="search" id="date-start" type="date" aria-label="Start date">
      <span style="color:var(--ink-faint)">&ndash;</span>
      <input class="search" id="date-end" type="date" aria-label="End date">
    </div>
    <input class="search" id="search" type="text" placeholder="Search...">
    <button class="chip btn-solid" id="export-pdf-btn" hidden>Export PDF</button>
    <button class="chip btn-solid" id="add-txn-btn" hidden>+ Add Transaction</button>
  </div>

  <section class="panel">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th data-sort="txn_date">Date <span class="arrow"></span></th>
            <th data-sort="to_party">To</th>
            <th data-sort="from_party">From</th>
            <th data-sort="amount" style="text-align:right">Amount <span class="arrow"></span></th>
            <th data-sort="reporting_category">Category</th>
            <th>Sub-category</th>
            <th data-sort="status">Status</th>
            <th>Purpose</th>
            <th>Proof</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div class="empty-state" id="empty-state" hidden>No transactions match these filters.</div>
    </div>
  </section>

  <div class="lightbox" id="lightbox"><img id="lightbox-img" src="" alt=""></div>
  <div class="lightbox" id="narration-lightbox">
    <div class="narration-box" onclick="event.stopPropagation()">
      <p class="narration-label">Purpose</p>
      <div id="purpose-text"></div>
      <div id="purpose-edit-area" hidden>
        <textarea id="purpose-edit-input" style="width:100%; box-sizing:border-box; min-height:70px; font:inherit; font-size:0.85rem; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--ink);"></textarea>
        <div class="modal-actions">
          <button class="chip btn-solid" id="purpose-save-btn">Save</button>
          <button class="chip" id="purpose-cancel-btn">Cancel</button>
        </div>
      </div>
      <button class="chip edit-link" id="purpose-edit-btn" hidden>Edit purpose</button>
      <button class="chip edit-link" id="delete-txn-btn" hidden style="border-color:var(--red); color:var(--red); margin-left:8px;">Delete transaction</button>
      <p class="narration-label" style="margin-top:16px;">Bank Narration (raw, unedited)</p>
      <div id="narration-text"></div>
    </div>
  </div>
  <div class="lightbox" id="add-txn-lightbox">
    <div class="narration-box" onclick="event.stopPropagation()" style="text-align:left;">
      <p class="narration-label">Add Transaction</p>
      <form id="add-txn-form" class="admin-form">
        <label>Date <input type="date" name="txn_date" required></label>
        <label>Direction
          <select name="direction" required>
            <option value="debit">Debit</option>
            <option value="credit">Credit</option>
          </select>
        </label>
        <label>Amount <input type="number" name="amount" step="0.01" min="0" required></label>
        <label>To <input type="text" name="to_party"></label>
        <label>From <input type="text" name="from_party"></label>
        <label>Category <select name="reporting_category" required></select></label>
        <label>Sub-category <input type="text" name="sub_category" list="subcategory-list"></label>
        <label>Status <select name="status" required></select></label>
        <label>Purpose <textarea name="purpose" required></textarea></label>
        <div class="modal-actions">
          <button type="submit" class="chip btn-solid">Create</button>
          <button type="button" class="chip" id="add-txn-cancel-btn">Cancel</button>
        </div>
        <p class="form-error" id="add-txn-error" hidden></p>
      </form>
    </div>
  </div>
  <datalist id="subcategory-list"></datalist>
</main>

<script>
const TRANSACTIONS = /*__TRANSACTIONS_JSON__*/;
const IS_ADMIN = /*__IS_ADMIN__*/;
const HAS_BACKEND = /*__HAS_BACKEND__*/;
const REPORTING_CATEGORIES = /*__REPORTING_CATEGORIES_JSON__*/;
const STATUSES = /*__STATUSES_JSON__*/;
const SUBCATEGORIES = /*__SUBCATEGORIES_JSON__*/;

const CATEGORY_COLOR = {
  "2A - Phase-0 Pragya": "var(--forest)",
  "2B - Architecture": "var(--blue)",
  "2C - Operating/Admin": "var(--gold)",
  "Internal Transfer": "var(--ink-faint)",
  "Reversal": "var(--red)",
  "Income": "var(--purple)",
};

const fmtINR = n => "₹" + Math.round(n).toLocaleString("en-IN");
const fmtDate = d => new Date(d + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });

function renderKPIs(rows) {
  const debits = rows.filter(t => t.direction === "debit" && t.expense_included);
  const credits = rows.filter(t => t.direction === "credit" && t.reporting_category === "Income");
  const withEvidence = rows.filter(t => t.thumbnail);
  const income = credits.reduce((s, t) => s + t.amount, 0);
  const expenses = debits.reduce((s, t) => s + t.amount, 0);
  const tiles = [
    { label: "Income", value: fmtINR(income) },
    { label: "Expenses", value: fmtINR(expenses) },
    { label: "Current Balance", value: fmtINR(income - expenses) },
    { label: "With Matched Proof", value: `${withEvidence.length} / ${rows.length}` },
  ];
  document.getElementById("kpi-row").innerHTML = tiles.map(t => `
    <div class="kpi-tile"><p class="kpi-label">${t.label}</p><p class="kpi-value">${t.value}</p></div>
  `).join("");
}

function categoryPill(t) {
  return t.reporting_category
    ? `<span class="pill" style="background:${CATEGORY_COLOR[t.reporting_category] || "var(--ink-faint)"}">${t.reporting_category}</span>`
    : "—";
}

function statusPill(t) {
  return t.status ? `<span class="status-pill ${t.status === "Supported" ? "supported" : ""}">${t.status}</span>` : "—";
}

function proofCellHTML(t) {
  if (t.thumbnail) {
    const replace = IS_ADMIN ? `<button class="proof-replace" data-id="${t.id}" title="Replace proof">&#8635;</button>` : "";
    return `<span class="proof-wrap"><img class="thumb" src="${t.thumbnail}" data-full="${t.full_image || t.thumbnail}" alt="receipt">${replace}</span>`;
  }
  if (IS_ADMIN) return `<button class="thumb-upload" data-id="${t.id}">+ Upload</button>`;
  return `<span class="thumb-empty">—</span>`;
}

const MAX_UPLOAD_BYTES = 4 * 1024 * 1024; // stay under Vercel's serverless function payload limit (~4.5MB)

function compressImage(file, maxDim = 2000, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("Compression failed")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read image")); };
    img.src = url;
  });
}

async function saveAdminEdit(id, fields) {
  try {
    const res = await fetch(`/admin/transactions/${id}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(fields),
    });
    const data = await res.json();
    if (!res.ok) { console.error(data.error || "Save failed"); return false; }
    const t = TRANSACTIONS.find(x => x.id == id);
    Object.assign(t, data.fields);
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}

let activeDirection = "all";
let activeCategory = "all";
let sortKey = "txn_date";
let sortDir = 1;
let lastRenderedRows = [];

function renderFilters() {
  const dirHTML = ["all", "debit", "credit"].map(d => `
    <button class="chip ${d === activeDirection ? "active" : ""}" data-dir="${d}">${d === "all" ? "All" : d[0].toUpperCase() + d.slice(1)}</button>
  `).join("");
  document.getElementById("direction-filters").innerHTML = dirHTML;

  const cats = [...new Set(TRANSACTIONS.map(t => t.reporting_category))].filter(Boolean);
  const catHTML = ['<button class="chip active" data-cat="all">All categories</button>']
    .concat(cats.map(c => `<button class="chip" data-cat="${c}">${c}</button>`)).join("");
  document.getElementById("category-filters").innerHTML = catHTML;

  document.querySelectorAll("[data-dir]").forEach(btn => btn.addEventListener("click", () => {
    activeDirection = btn.dataset.dir;
    document.querySelectorAll("[data-dir]").forEach(b => b.classList.toggle("active", b === btn));
    renderTable();
  }));
  document.querySelectorAll("[data-cat]").forEach(btn => btn.addEventListener("click", () => {
    activeCategory = btn.dataset.cat;
    document.querySelectorAll("[data-cat]").forEach(b => b.classList.toggle("active", b === btn));
    renderTable();
  }));
  document.getElementById("search").addEventListener("input", renderTable);
  document.getElementById("date-start").addEventListener("input", renderTable);
  document.getElementById("date-end").addEventListener("input", renderTable);

  document.querySelectorAll("thead th[data-sort]").forEach(th => th.addEventListener("click", () => {
    const key = th.dataset.sort;
    sortDir = (sortKey === key) ? -sortDir : 1;
    sortKey = key;
    document.querySelectorAll("thead .arrow").forEach(a => a.textContent = "");
    th.querySelector(".arrow").textContent = sortDir === 1 ? "↑" : "↓";
    renderTable();
  }));

  if (IS_ADMIN) document.getElementById("add-txn-btn").hidden = false;
  if (HAS_BACKEND) document.getElementById("export-pdf-btn").hidden = false;
}

function getFilteredRows() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const startDate = document.getElementById("date-start").value;
  const endDate = document.getElementById("date-end").value;
  let rows = TRANSACTIONS
    .filter(t => activeDirection === "all" || t.direction === activeDirection)
    .filter(t => activeCategory === "all" || t.reporting_category === activeCategory)
    .filter(t => !startDate || t.txn_date >= startDate)
    .filter(t => !endDate || t.txn_date <= endDate)
    .filter(t => !q || [t.to_party, t.from_party, t.bank_narration, t.purpose].some(f => (f || "").toLowerCase().includes(q)));

  return rows.slice().sort((a, b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (av === bv) return 0;
    if (av === null || av === undefined) return 1;
    if (bv === null || bv === undefined) return -1;
    return (av > bv ? 1 : -1) * sortDir;
  });
}

function renderTable() {
  const rows = getFilteredRows();
  lastRenderedRows = rows;
  renderKPIs(rows);

  document.getElementById("empty-state").hidden = rows.length > 0;

  document.getElementById("table-body").innerHTML = rows.map(t => `
    <tr>
      <td class="cell-date">${fmtDate(t.txn_date)}</td>
      <td>${t.to_party || "—"}</td>
      <td>${t.from_party || "—"}</td>
      <td class="cell-amount ${t.direction}">${t.direction === "credit" ? "+" : "−"}${fmtINR(t.amount)}</td>
      <td${IS_ADMIN ? ` class="editable" data-edit="reporting_category" data-id="${t.id}"` : ""}>${categoryPill(t)}</td>
      <td${IS_ADMIN ? ` class="editable" data-edit="sub_category" data-id="${t.id}"` : ""}>${t.sub_category || "—"}</td>
      <td${IS_ADMIN ? ` class="editable" data-edit="status" data-id="${t.id}"` : ""}>${statusPill(t)}</td>
      <td class="narration" data-narration-idx="${t.id}">${t.purpose || t.bank_narration || ""}</td>
      <td>${proofCellHTML(t)}</td>
    </tr>`).join("");

  attachRowHandlers();
}

function attachRowHandlers() {
  document.querySelectorAll(".narration").forEach(cell => cell.addEventListener("click", () => {
    const t = TRANSACTIONS.find(x => x.id == cell.dataset.narrationIdx);
    document.getElementById("purpose-text").textContent = t.purpose || "(no purpose recorded)";
    document.getElementById("purpose-text").hidden = false;
    document.getElementById("purpose-edit-area").hidden = true;
    document.getElementById("purpose-edit-btn").hidden = !IS_ADMIN;
    document.getElementById("purpose-edit-btn").dataset.id = t.id;
    document.getElementById("delete-txn-btn").hidden = !IS_ADMIN;
    document.getElementById("delete-txn-btn").dataset.id = t.id;
    document.getElementById("narration-text").textContent = t.bank_narration || "(no narration text)";
    document.getElementById("narration-lightbox").classList.add("visible");
  }));

  document.querySelectorAll(".thumb").forEach(img => img.addEventListener("click", () => {
    document.getElementById("lightbox-img").src = img.dataset.full;
    document.getElementById("lightbox").classList.add("visible");
  }));

  if (!IS_ADMIN) return;

  document.querySelectorAll("[data-edit]").forEach(cell => cell.addEventListener("click", function handler() {
    if (cell.querySelector("select, input")) return;
    const field = cell.dataset.edit;
    const id = cell.dataset.id;
    const t = TRANSACTIONS.find(x => x.id == id);
    let input;
    if (field === "reporting_category") {
      input = document.createElement("select");
      REPORTING_CATEGORIES.forEach(c => input.add(new Option(c, c, false, c === t.reporting_category)));
    } else if (field === "status") {
      input = document.createElement("select");
      STATUSES.forEach(s => input.add(new Option(s, s, false, s === t.status)));
    } else {
      input = document.createElement("input");
      input.type = "text";
      input.value = t.sub_category || "";
      input.setAttribute("list", "subcategory-list");
    }
    input.className = "admin-edit-input";
    cell.innerHTML = "";
    cell.appendChild(input);
    input.focus();

    let settled = false;
    const commit = async () => {
      if (settled) return;
      settled = true;
      await saveAdminEdit(id, { [field]: input.value });
      renderTable();
    };
    const cancel = () => {
      if (settled) return;
      settled = true;
      renderTable();
    };
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); input.blur(); }
      if (e.key === "Escape") { e.preventDefault(); cancel(); }
    });
  }));

  document.querySelectorAll(".thumb-upload, .proof-replace").forEach(btn => btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const id = btn.dataset.id;
    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = ".pdf,.jpg,.jpeg,.png";
    fileInput.addEventListener("change", async () => {
      if (!fileInput.files[0]) return;
      let file = fileInput.files[0];
      try {
        if (file.type.startsWith("image/")) {
          const compressed = await compressImage(file);
          file = new File([compressed], "evidence.jpg", { type: "image/jpeg" });
        }
      } catch (err) {
        alert("Could not process that image, please try a different file.");
        return;
      }
      if (file.size > MAX_UPLOAD_BYTES) {
        alert(`File is too large (${(file.size / 1024 / 1024).toFixed(1)} MB). Please use a file under 4 MB -- PDFs can't be auto-compressed here, try a smaller scan.`);
        return;
      }
      const formData = new FormData();
      formData.append("file", file);
      try {
        const res = await fetch(`/admin/transactions/${id}/evidence`, { method: "POST", body: formData });
        const data = await res.json();
        if (!res.ok) { console.error(data.error || "Upload failed"); return; }
        const t = TRANSACTIONS.find(x => x.id == id);
        const bust = `?v=${Date.now()}`;
        t.thumbnail = data.thumbnail + bust;
        t.full_image = data.full_image + bust;
        renderTable();
      } catch (err) { console.error(err); }
    });
    fileInput.click();
  }));
}

document.getElementById("narration-lightbox").addEventListener("click", () => {
  document.getElementById("narration-lightbox").classList.remove("visible");
});

document.getElementById("purpose-edit-btn").addEventListener("click", () => {
  const t = TRANSACTIONS.find(x => x.id == document.getElementById("purpose-edit-btn").dataset.id);
  document.getElementById("purpose-edit-input").value = t.purpose || "";
  document.getElementById("purpose-text").hidden = true;
  document.getElementById("purpose-edit-area").hidden = false;
});
document.getElementById("purpose-cancel-btn").addEventListener("click", () => {
  document.getElementById("purpose-edit-area").hidden = true;
  document.getElementById("purpose-text").hidden = false;
});
document.getElementById("purpose-save-btn").addEventListener("click", async () => {
  const id = document.getElementById("purpose-edit-btn").dataset.id;
  const newPurpose = document.getElementById("purpose-edit-input").value;
  const ok = await saveAdminEdit(id, { purpose: newPurpose });
  if (ok) {
    document.getElementById("purpose-text").textContent = newPurpose || "(no purpose recorded)";
    document.getElementById("purpose-edit-area").hidden = true;
    document.getElementById("purpose-text").hidden = false;
    renderTable();
  }
});

document.getElementById("lightbox").addEventListener("click", () => {
  document.getElementById("lightbox").classList.remove("visible");
});

if (IS_ADMIN) {
  document.getElementById("delete-txn-btn").addEventListener("click", async () => {
    const id = document.getElementById("delete-txn-btn").dataset.id;
    const t = TRANSACTIONS.find(x => x.id == id);
    if (!t) return;
    if (!confirm(`Permanently delete this transaction (${fmtDate(t.txn_date)}, ${fmtINR(t.amount)})? This cannot be undone.`)) return;
    try {
      const res = await fetch(`/admin/transactions/${id}/delete`, { method: "POST" });
      const data = await res.json();
      if (!res.ok) { console.error(data.error || "Delete failed"); return; }
      const idx = TRANSACTIONS.findIndex(x => x.id == id);
      TRANSACTIONS.splice(idx, 1);
      document.getElementById("narration-lightbox").classList.remove("visible");
      renderTable();
    } catch (err) {
      console.error(err);
    }
  });

  const catSelect = document.querySelector('#add-txn-form [name="reporting_category"]');
  REPORTING_CATEGORIES.forEach(c => catSelect.add(new Option(c, c)));
  const statusSelect = document.querySelector('#add-txn-form [name="status"]');
  STATUSES.forEach(s => statusSelect.add(new Option(s, s)));
  document.getElementById("subcategory-list").innerHTML = SUBCATEGORIES.map(s => `<option value="${s}">`).join("");

  document.getElementById("add-txn-btn").addEventListener("click", () => {
    document.getElementById("add-txn-form").reset();
    document.getElementById("add-txn-error").hidden = true;
    document.getElementById("add-txn-lightbox").classList.add("visible");
  });
  document.getElementById("add-txn-cancel-btn").addEventListener("click", () => {
    document.getElementById("add-txn-lightbox").classList.remove("visible");
  });
  document.getElementById("add-txn-lightbox").addEventListener("click", () => {
    document.getElementById("add-txn-lightbox").classList.remove("visible");
  });
  document.getElementById("add-txn-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = Object.fromEntries(new FormData(e.target).entries());
    payload.amount = parseFloat(payload.amount);
    const errorEl = document.getElementById("add-txn-error");
    errorEl.hidden = true;
    try {
      const res = await fetch("/admin/transactions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) { errorEl.textContent = data.error || "Failed to create transaction."; errorEl.hidden = false; return; }
      location.reload();
    } catch (err) {
      errorEl.textContent = "Network error.";
      errorEl.hidden = false;
    }
  });
}

if (HAS_BACKEND) {
  document.getElementById("export-pdf-btn").addEventListener("click", async () => {
    const ids = lastRenderedRows.map(t => t.id);
    if (!ids.length) return;
    const parts = [];
    if (activeDirection !== "all") parts.push(activeDirection === "credit" ? "Credits only" : "Debits only");
    if (activeCategory !== "all") parts.push(`Category: ${activeCategory}`);
    const startDate = document.getElementById("date-start").value;
    const endDate = document.getElementById("date-end").value;
    if (startDate || endDate) parts.push(`${startDate ? fmtDate(startDate) : "Start"} – ${endDate ? fmtDate(endDate) : "Present"}`);
    const q = document.getElementById("search").value.trim();
    if (q) parts.push(`Search: "${q}"`);
    const filterSummary = parts.length ? parts.join(" · ") : "All transactions";

    const btn = document.getElementById("export-pdf-btn");
    btn.disabled = true;
    const originalLabel = btn.textContent;
    btn.textContent = "Exporting…";
    try {
      const res = await fetch("/export/pdf", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids, filter_summary: filterSummary }),
      });
      if (!res.ok) throw new Error("Export failed");
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "golden-face-ledger.pdf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    } catch (err) {
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  });
}

renderFilters();
renderTable();
</script>
